<svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradient for H Icon -->
    <linearGradient id="hasanLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="hasanAccentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Background Glow Effect (Optional for Depth) -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#hasanLogoGradient)" fill-opacity="0.08" />

  <!-- Outer Rounded Tech Container Frame -->
  <rect x="10" y="10" width="80" height="80" rx="20" stroke="url(#hasanLogoGradient)" stroke-width="3" stroke-dasharray="160 40" />

  <!-- Modern 'H' Lettermark Geometry -->
  <g transform="translate(2, 0)">
    <!-- Left Pillar of H -->
    <path d="M 30 25 L 30 75 Q 30 80 35 80 L 37 80 Q 42 80 42 75 L 42 25 Q 42 20 37 20 L 35 20 Q 30 20 30 25 Z" fill="url(#hasanLogoGradient)" />
    
    <!-- Right Pillar of H -->
    <path d="M 58 25 L 58 75 Q 58 80 63 80 L 65 80 Q 70 80 70 75 L 70 25 Q 70 20 65 20 L 63 20 Q 58 20 58 25 Z" fill="url(#hasanLogoGradient)" />

    <!-- Dynamic Diagonal Crossbar (Modern Tech Bridge) -->
    <path d="M 38 43 L 62 53 Q 66 55 62 57 L 38 47 Q 34 45 38 43 Z" fill="url(#hasanAccentGradient)" />
  </g>

  <!-- Modern Tech Accent Dots -->
  <circle cx="36" cy="24" r="3" fill="#EC4899" />
  <circle cx="64" cy="76" r="3" fill="#6366F1" />
</svg>
